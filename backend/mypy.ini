[mypy]
python_version = 3.12
ignore_missing_imports = True
exclude = repos/|scratch/|\.cache/|examples/
explicit_package_bases = True
warn_return_any = False
warn_unused_ignores = True

# Relax strictness for generated/complex modules
[mypy-app.retrievers.query_resolver]
ignore_errors = True

[mypy-app.parsers.typescript_parser]
ignore_errors = False
