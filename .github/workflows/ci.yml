name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-genai
          # Install CPU-only torch + sentence-transformers for embedding tests
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install sentence-transformers

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check app/ --select E,F,I,B --ignore E501,B008

      - name: Run tests
        run: |
          python -m pytest tests/ -q --tb=short \
            --ignore=tests/test_api.py \
            --ignore=tests/test_security_auth.py
        # API tests are excluded from CI because they use TestClient with async
        # background tasks that require 3-5 minutes each due to event loop
        # scheduling constraints. Run them locally with: pytest tests/test_api.py

      - name: Run fast API smoke tests
        run: |
          python -m pytest tests/test_api.py::TestAnalyzeEndpoint \
                           tests/test_api.py::TestGraphEndpoint \
                           tests/test_api.py::TestQAEndpoint -q --tb=short

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff format app/ --check

      - name: Check linting
        run: ruff check app/ --select E,F,I,B --ignore E501,B008
